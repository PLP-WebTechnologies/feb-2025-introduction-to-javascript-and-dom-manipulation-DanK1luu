<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS DOM Manipulation</title>
    <style>
        /* Basic styling for clarity */
        body {
            font-family: sans-serif;
            padding: 20px;
        }
        .highlight {
            background-color: yellow;
            font-weight: bold;
        }
        #elementContainer div {
            border: 1px solid lightblue;
            padding: 10px;
            margin-top: 10px;
            background-color: #eef;
        }
    </style>
</head>
<body>

    <header>
        <h1>JavaScript DOM Interaction</h1>
    </header>

    <main>
        <p id="textToChange">This is the original text.</p>
        <section>
            <h2>Actions</h2>
            <button id="changeTextBtn">Change Text</button>
            <button id="changeStyleBtn">Change Style</button>
            <button id="toggleElementBtn">Add/Remove Element</button>
        </section>

        <section id="elementContainer">
            <p>Container for dynamic element:</p>
            </section>
    </main>

    <footer>
        <p>Always happy to code!</p>
    </footer>

    <script src="script.js" defer></script>

</body>
</html>
